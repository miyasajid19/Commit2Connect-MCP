[project]
name = "linkedin-mcp-server"
version = "0.1.0"
description = "MCP server for posting to LinkedIn via the official Share on LinkedIn REST API (v202401)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "itsdangerous>=2.1",
    "fastmcp>=3.4.7",
]
